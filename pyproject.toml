[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-splauts"
version = "0.1.0"
description = "CPU research prototype for differentiable bioacoustic localization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "numpy>=1.26", "matplotlib>=3.8"]

[project.scripts]
splauts = "splauts.__main__:main"

[tool.setuptools.packages.find]
include = ["splauts*"]
